name: Deploy main app to production

# Manually triggered only. Nothing in this file fires automatically.
# Production-affecting paths stay out of ci.yml so an automatic push
# to main cannot deploy to production.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string

jobs:
  check-confirmation:
    name: Verify confirmation string
    runs-on: ubuntu-24.04
    steps:
      - name: Check input
        if: ${{ inputs.confirmation != 'deploy-to-production' }}
        run: |
          echo "Confirmation string did not match."
          echo "Expected: deploy-to-production"
          echo "Received: ${{ inputs.confirmation }}"
          exit 1

  preflight-migrations:
    name: Verify production schema is current
    runs-on: ubuntu-24.04
    needs: check-confirmation
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.34.3

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      # Fail if any local migration is absent from the remote ledger.
      # migration list output columns: Local | Remote | Time (UTC).
      # A row with a local version but empty Remote cell means
      # "not applied to production". Any such row blocks the deploy.
      - name: Check for unapplied migrations
        run: |
          set -euo pipefail
          out=$(supabase migration list --linked)
          echo "$out"
          missing=$(echo "$out" | awk -F'|' '$1 ~ /[0-9]/ && $2 ~ /^[[:space:]]*$/')
          if [ -n "$missing" ]; then
            echo "::error::Production schema is behind local HEAD. Unapplied migrations:"
            echo "$missing"
            echo "Fire the production-migrations workflow first."
            exit 1
          fi
          echo "Production schema is current — all local migrations applied."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

  deploy-production:
    name: Build and deploy production Worker
    runs-on: ubuntu-24.04
    needs: [check-confirmation, preflight-migrations]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Cloudflare tooling
        run: npm install --no-save --legacy-peer-deps @opennextjs/cloudflare@1.20.6 wrangler@4.134.0 esbuild@0.25.4

      # NEXT_PUBLIC_* are baked into the bundle at build time. This is
      # why a separate workflow is needed — the staging deploy-main-app
      # job bakes staging's URL, and this job bakes production's.
      - name: Build Worker (production)
        run: npm run build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}

      # Prerequisites (both satisfied as of 2026-10-16):
      #   - secrets.PRODUCTION_PIN_PEPPER is set in repo secrets.
      #   - SENTRY_ENVIRONMENT=production is set in
      #     wrangler.production.jsonc vars block, so the Sentry init
      #     does not fall through to its staging default on prod.
      # The preflight-migrations job (above) blocks deployment until
      # the production schema is caught up to local HEAD.
      - name: Set production Worker secrets
        run: |
          printf '%s' "${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.production.jsonc
          printf '%s' "${{ secrets.PRODUCTION_PIN_PEPPER }}" | npx wrangler secret put PIN_PEPPER --config wrangler.production.jsonc
          printf '%s' "${{ secrets.SENTRY_DSN }}" | npx wrangler secret put SENTRY_DSN --config wrangler.production.jsonc
          printf '%s' "${{ secrets.PRODUCTION_PAYSTACK_SECRET_KEY }}" | npx wrangler secret put PAYSTACK_SECRET_KEY --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test-production:
    name: Smoke test production Worker
    runs-on: ubuntu-24.04
    needs: deploy-production
    steps:
      - uses: actions/checkout@v5
      - name: Run smoke test
        run: bash scripts/smoke-test-deployed.sh https://access-control-platform-production.projectosb416.workers.dev
