name: Apply migrations to production

# Manually triggered only. Nothing in this file fires automatically.
# See docs/ops/production-migrations.md for the full policy.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "apply-to-production" to confirm'
        required: true
        type: string

jobs:
  check-confirmation:
    name: Verify confirmation string
    runs-on: ubuntu-latest
    steps:
      - name: Check input
        if: ${{ inputs.confirmation != 'apply-to-production' }}
        run: |
          echo "Confirmation string did not match."
          echo "Expected: apply-to-production"
          echo "Received: ${{ inputs.confirmation }}"
          exit 1

  apply-migrations:
    name: Backup and apply migrations
    runs-on: ubuntu-latest
    needs: check-confirmation
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3

      - name: Backup production (schema)
        run: |
          mkdir -p backups
          supabase db dump \
            --db-url "postgresql://postgres.${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}:${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}@aws-1-eu-west-1.pooler.supabase.com:5432/postgres" \
            -f "backups/schema-$(date +%Y%m%d-%H%M%S).sql"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backup
          path: backups/*.sql
          retention-days: 90

      - name: Link production project
        run: supabase link --project-ref "$PRODUCTION_SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}

      - name: Report success
        run: |
          echo "Migrations applied to production."
          echo "Check the Supabase dashboard to verify schema."
